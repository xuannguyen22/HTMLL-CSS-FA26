<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Card Sản Phẩm</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: sans-serif;
        background: #f4f4f4;
        padding: 40px;
        display: flex;
        justify-content: center;
      }

      .card {
        width: 280px;
        background: #fff;
        border-radius: 8px;
        padding: 15px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
        transition: transform 0.3s;
      }
      .card:hover {
        transform: translateY(-5px);
      } /* Hiệu ứng nảy khi hover */
      .card img {
        width: 100%;
        height: 160px;
        object-fit: cover;
        border-radius: 4px;
      }
      .title {
        font-size: 1.1rem;
        margin: 10px 0;
      }
      .price {
        color: e53935;
        font-weight: bold;
        margin-bottom: 10px;
      }
      .btn {
        display: inline-block;
        padding: 8px 16px;
        background: #008080;
        color: #fff;
        text-decoration: none;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="img/thach vai.jpg" alt="">
      <h3 class="title">Trà Thạch Vải Poly</h3>
      <p class="price">25.000 VNĐ</p>
      <a href="#" class="btn">Mua Ngay</a>
    </div>
    <div class="card">
      <img src="img/thach vai.jpg" alt="">
      <h3 class="title">Trà Thạch Vải Poly</h3>
      <p class="price">25.000 VNĐ</p>
      <a href="#" class="btn">Mua Ngay</a>
    </div>
    <div class="card">
      <img src="img/thach vai.jpg" alt="">
      <h3 class="title">Trà Thạch Vải Poly</h3>
      <p class="price">25.000 VNĐ</p>
      <a href="#" class="btn">Mua Ngay</a>
    </div>
    <div class="card">
      <img src="img/thach vai.jpg" alt="">
      <h3 class="title">Trà Thạch Vải Poly</h3>
      <p class="price">25.000 VNĐ</p>
      <a href="#" class="btn">Mua Ngay</a>
    </div>
  </body>
</html>
